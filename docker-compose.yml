services:
  postgres:
    image: postgres:16-alpine
    container_name: velozity_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dashboard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dashboard"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: velozity_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/dashboard?schema=public
      ACCESS_TOKEN_SECRET: development_access_token_secret_32_chars_long
      REFRESH_TOKEN_SECRET: development_refresh_token_secret_32_chars_long
      ACCESS_TOKEN_TTL: 15m
      REFRESH_TOKEN_TTL: 7d
      CLIENT_URL: http://localhost:5173
      PORT: 4000
      NODE_ENV: development

volumes:
  pgdata:
    driver: local
